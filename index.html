
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mk3 Pundri - Watch, Play & Earn</title>
  
  <!-- Telegram & Ad SDKs -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 15px; }
    .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { background: #28a745; color: white; border: none; padding: 12px 15px; font-size: 15px; border-radius: 8px; cursor: pointer; width: 100%; margin: 5px 0; font-weight: bold; }
    .btn-blue { background: #008cba; }
    .btn-purple { background: #6f42c1; }
    .btn-orange { background: #fd7e14; }
    input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    /* Game Modal Frame */
    #gameModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; }
    #gameContainer { position: relative; width: 90%; height: 80%; margin: 10% auto; background: white; border-radius: 12px; overflow: hidden; }
    .close-btn { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; z-index: 1001; }
  </style>
</head>
<body>

  <!-- Dashboard -->
  <div class="card">
    <h2>🏆 Welcome Player</h2>
    <h3>बैलेंस: <span id="balance">0</span> Coins</h3>
    <p>आज के ऐड्स देखें: <span id="ad-count">0</span>/20</p>
  </div>

  <!-- 1. Watch Ads Section -->
  <div class="card">
    <h3>📺 Watch Ads & Earn</h3>
    <button class="btn" onclick="watchAd()">ऐड देखें (+1 Coin)</button>
  </div>

  <!-- 2. Play 4 Games Section -->
  <div class="card">
    <h3>🎮 Play Games (+1 Coin Per Play)</h3>
    <div class="game-grid">
      <button class="btn btn-blue" onclick="openGame('https://play.gamepix.com/spin-per-day/embed')">🎯 Spin Wheel</button>
      <button class="btn btn-purple" onclick="openGame('https://play.gamepix.com/tic-tac-toe-3/embed')">❌ Tic-Tac-Toe</button>
      <button class="btn btn-orange" onclick="openGame('https://play.gamepix.com/memory-match-3/embed')">🧠 Memory Game</button>
      <button class="btn btn-blue" onclick="openGame('https://play.gamepix.com/number-challenge/embed')">🔢 Guess Number</button>
    </div>
  </div>

  <!-- Game Modal Screen -->
  <div id="gameModal">
    <div id="gameContainer">
      <button class="close-btn" onclick="closeGame()">❌ बंद करें</button>
      <iframe id="gameFrame" src="" style="width:100%; height:100%; border:none;"></iframe>
    </div>
  </div>

  <!-- 3. Tasks Section -->
  <div class="card">
    <h3>📋 Tasks & Bonus</h3>
    <button class="btn btn-purple" onclick="completeTask('📢 Telegram Join', 20)">📢 Join Telegram (+20 Coins)</button>
  </div>

  <!-- 4. UPI Withdrawal Section -->
  <div class="card">
    <h3>💸 UPI Withdrawal (Google Pay)</h3>
    <p><b>दर:</b> 1000 Coins = ₹10</p>
    <input type="text" id="upiId" placeholder="UPI ID (उदा: username@upi)">
    <button class="btn btn-blue" onclick="requestWithdrawal()">Google Pay पर रिडीम करें (₹10)</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    let userCoins = 0;
    let adsWatchedToday = 0;
    const MAX_DAILY_ADS = 20;

    // Adsgram Initialization (अपनी Adsgram Block ID यहाँ डालें)
    const AdController = window.Adsgram?.init({ blockId: "YOUR_ADSGRAM_BLOCK_ID" });

    function watchAd() {
      if (adsWatchedToday >= MAX_DAILY_ADS) {
        alert("⚠️ आपकी आज की ऐड लिमिट (20/20) पूरी हो चुकी है!");
        return;
      }

      if (AdController) {
        AdController.show().then(() => {
          userCoins += 1;
          adsWatchedToday += 1;
          updateUI();
          alert("🎉 ऐड पूरा देखा! +1 Coin मिला।");
        }).catch((err) => {
          // अगर Ad Block हो या Adsgram न चले तो Fallback Reward
          userCoins += 1;
          adsWatchedToday += 1;
          updateUI();
          alert("🎉 +1 Coin आपके खाते में जोड़ दिया गया है!");
        });
      } else {
        userCoins += 1;
        adsWatchedToday += 1;
        updateUI();
        alert("🎉 +1 Coin आपके खाते में जोड़ दिया गया है!");
      }
    }

    function openGame(gameUrl) {
      document.getElementById('gameFrame').src = gameUrl;
      document.getElementById('gameModal').style.display = 'block';
      userCoins += 1;
      updateUI();
    }

    function closeGame() {
      document.getElementById('gameModal').style.display = 'none';
      document.getElementById('gameFrame').src = '';
    }

    function completeTask(taskName, bonus) {
      userCoins += bonus;
      updateUI();
      alert(`✅ '${taskName}' टास्क पूरा करने पर +${bonus} Coins मिले!`);
    }

    function requestWithdrawal() {
      const upi = document.getElementById('upiId').value.trim();
      
      if (!upi || !upi.includes('@')) {
        alert("❌ कृपया सही UPI ID दर्ज करें!");
        return;
      }
      
      if (userCoins < 1000) {
        alert(`❌ मिनिमम विथड्रॉल 1000 कॉइन्स (₹10) है। आपके पास अभी ${userCoins} कॉइन्स हैं।`);
        return;
      }

      const inrAmount = (userCoins / 1000) * 10;

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({
          action: "withdraw",
          method: "Google Pay / UPI",
          upi_id: upi,
          coins: userCoins,
          amount_inr: inrAmount
        }));
      }

      alert(`✅ ₹${inrAmount} की विथड्रॉल रिक्वेस्ट भेज दी गई है!`);
    }

    function updateUI() {
      document.getElementById('balance').innerText = userCoins;
      document.getElementById('ad-count').innerText = adsWatchedToday;
    }
  </script>
</body>
</html>
